name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # SNAKE_TOKEN: classic PAT with read:user, so private contributions are counted.
          # Without the secret the built-in token is used and only public activity shows.
          github_token: ${{ secrets.SNAKE_TOKEN || github.token }}
          outputs: |
            dist/snake.svg?color_snake=#B91C1C&color_dots=#EBEDF0,#9BE9A8,#40C463,#30A14E,#216E39
            dist/snake-dark.svg?color_snake=#EF4444&color_dots=#161B22,#0E4429,#006D32,#26A641,#39D353

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
